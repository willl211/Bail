# Recette privée — déploiement **avant** d'avoir un nom de domaine.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.recette.yml \
#     --env-file deploy/.env up -d --build migrate api web
#
# Noter les trois services nommés en fin de commande : le proxy n'est pas
# démarré. Sans nom de domaine il n'a rien à router et ne pourrait obtenir aucun
# certificat.
#
# À quoi ça sert : vérifier que l'instance, la base managée, le stockage objet
# et le SMTP fonctionnent ensemble, sans attendre le choix du nom. C'est la
# moitié du chemin, et c'est celle qui réserve les mauvaises surprises —
# l'endpoint du stockage, la chaîne de connexion à la base, l'authentification
# SMTP.
#
# ATTENTION — ce mode sert en **HTTP, sans chiffrement**.
#
# Les ports sont donc publiés sur `127.0.0.1` et non sur toutes les interfaces :
# rien n'est joignable depuis Internet, on y accède par un tunnel SSH.
#
#   ssh -L 3000:localhost:3000 -L 4000:localhost:4000 utilisateur@instance
#
# Puis dans un navigateur, sur votre poste : http://localhost:3000
#
# Ce n'est pas de la prudence excessive. **Un pare-feu ne suffirait pas** :
# Docker écrit ses propres règles de routage et court-circuite UFW, si bien
# qu'un port publié reste joignable depuis Internet alors que le pare-feu
# semble le refuser. La liaison à `127.0.0.1` ferme la question au lieu de la
# confier à une règle qui ne s'applique pas.
#
# Et n'y déposer **aucune pièce d'identité réelle** : une carte d'identité qui
# transite en clair est une fuite, quel que soit le nombre de personnes au
# courant de l'adresse.
#
# Ce que ce mode ne prouve pas, et qu'il faudra revérifier avec le domaine :
# les certificats, la redirection HTTP → HTTPS, et le cookie de session, qui
# porte ici sur un hôte unique et portera ensuite sur deux sous-domaines.

services:
  api:
    ports:
      - '127.0.0.1:4000:4000'

  web:
    ports:
      - '127.0.0.1:3000:3000'
