# Vérification automatique de chaque poussée et de chaque pull request.
#
# L'ordre des étapes est celui du coût : lint et types échouent en quelques
# secondes, les tests en quelques minutes, la compilation en dernier. Une faute
# de frappe n'a pas à attendre trois minutes pour être signalée.
#
# Les tests d'intégration parlent à un vrai PostgreSQL — c'est tout leur
# intérêt : deux onglets qui créent un dossier en même temps, deux locataires
# qui réservent le même créneau, un index d'unicité qui absorbe un doublon. Le
# service ci-dessous en fournit un ; aucune donnée réelle ne le traverse.

name: Vérification

on:
  push:
    branches: [master, main]
  pull_request:

# Une poussée annule la vérification précédente sur la même branche : la seule
# qui compte est celle du dernier commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # La campagne d'intégration en dérive `bail_test` : elle ne touche jamais
      # la base nommée ici (voir backend/test/setup-database.ts).
      DATABASE_URL: postgresql://bail:bail@localhost:5433/bail_dev?schema=public
      # Toutes les intégrations réglementées restent simulées (CLAUDE.md
      # règle 5). Un test qui appellerait un vrai prestataire dépendrait d'un
      # réseau, d'un quota et d'un compte.
      MAIL_DRIVER: mock
      KYC_DRIVER: mock
      PAYMENT_DRIVER: mock
      SIGNATURE_DRIVER: mock
      VIDEO_DRIVER: mock

    steps:
      - uses: actions/checkout@v5

      # Les mêmes services que sur un poste de développement, démarrés par le
      # même fichier : `services:` aurait demandé de redéclarer PostgreSQL et
      # MinIO ici, et deux définitions finissent toujours par diverger.
      #
      # Deux commandes et non une : `--wait` attend les contrôles de santé des
      # services durables, mais **échoue** dès qu'un conteneur se termine — même
      # avec le code 0. La création des conteneurs de stockage, elle, est une
      # tâche ponctuelle : `run --rm` propage son code de sortie, de sorte
      # qu'un échec de configuration arrête la vérification au lieu de la
      # laisser buter plus loin sur des conteneurs absents.
      - name: Démarrer les services
        run: docker compose up -d --wait postgres minio

      - name: Créer les conteneurs de stockage
        run: docker compose run --rm minio-init

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci` et non `install` : la version installée doit être exactement celle
      # du verrou, sans réévaluation des plages de versions.
      #
      # L'installation est de loin l'étape la plus longue (sept minutes sans
      # cache, contre soixante-dix secondes pour tout le reste réuni).
      # `--prefer-offline` sert le cache restauré par `setup-node` plutôt que le
      # réseau ; l'audit et le message de financement n'ont rien à faire dans
      # une vérification automatique.
      - name: Installer les dépendances
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Générer le client Prisma
        run: npm run prisma:generate --workspace backend

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests unitaires et de composants
        run: |
          npm run test:unit --workspace backend
          npm test --workspace frontend

      - name: Tests d'intégration
        run: npm run test:int --workspace backend
        env:
          # Le contrat de stockage est joué contre MinIO, pas seulement contre
          # le disque : c'est ce qui prouve que passer en objet ne change rien
          # au comportement attendu.
          S3_ENDPOINT: http://localhost:9000

      - name: Compilation
        run: npm run build
